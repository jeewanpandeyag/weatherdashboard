name: Update weather dashboard
on:
  push:
    branches:
      - main
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch CIMIS observations and NOAA forecast
        continue-on-error: true
        env:
          CIMIS_APP_KEY: ${{ secrets.CIMIS_APP_KEY }}
        run: python scripts/update_weather.py
      - name: Commit refreshed dataset
        run: |
          git config user.name "weatherdashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          git diff --cached --quiet || git commit -m "Update weather data"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment_attempt
        continue-on-error: true
      - name: Wait for uploaded artifact
        if: ${{ steps.deployment_attempt.outcome == 'failure' }}
        run: sleep 15
      - name: Retry GitHub Pages deployment
        if: ${{ steps.deployment_attempt.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
        id: deployment_retry
        continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment_attempt.outputs.page_url }}
