name: Update weather dashboard
on:
  push:
    branches:
      - main
  schedule:
    - cron: "15 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch CIMIS current conditions, UC Davis history and NOAA forecast
        env:
          CIMIS_APP_KEY: ${{ secrets.CIMIS_APP_KEY }}
        run: python scripts/update_weather.py
      - name: Commit refreshed dataset
        run: |
          git config user.name "weatherdashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          git diff --cached --quiet || git commit -m "Update weather data"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
